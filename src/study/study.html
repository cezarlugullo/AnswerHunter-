<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnswerHunter — Caderno de Estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B00;
      --primary-light: #FF9A40;
      --primary-glow: rgba(255, 107, 0, 0.12);
      --bg: #F7F9FC;
      --surface: #fff;
      --border: #E8EBF0;
      --text: #1A1A2E;
      --muted: #6B7280;
      --green: #16A34A;
      --green-bg: #F0FDF4;
      --green-border: #BBF7D0;
      --indigo: #6366F1;
      --indigo-bg: #EEF2FF;
      --header-sticky-offset: 80px;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      scrollbar-gutter: stable;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1A1A2E 0%, #2D2B55 100%);
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-family: 'Manrope', sans-serif; font-size: 1.25rem; font-weight: 800; }
    .logo span { color: var(--primary-light); }
    .logo-sub { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 2px; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .counter {
      background: rgba(255,107,0,0.18);
      color: var(--primary-light);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .btn-reset {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .btn-reset:hover { background: rgba(255,255,255,0.14); color: #fff; }

    /* ── Toolbar ── */
    .toolbar-wrap {
      position: sticky;
      top: var(--header-sticky-offset);
      z-index: 90;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
    }
    .toolbar {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 8px;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .search-wrap .icon-search {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--muted);
      pointer-events: none;
    }
    .toolbar input[type=text] {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.88rem;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .toolbar input[type=text]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip-group.tools { margin-left: auto; flex-shrink: 0; }
    .chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .chip .icon { font-size: 15px; }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tool-btn:hover { background: var(--bg); border-color: var(--muted); }
    .tool-btn .icon { font-size: 16px; color: var(--muted); }

    /* ── Progress ── */
    .progress-wrap {
      max-width: 860px;
      margin: 0 auto 0;
      padding: 10px 32px 14px;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .progress-track {
      flex: 1;
      height: 7px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 4px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-pct { min-width: 40px; text-align: right; color: var(--primary); font-weight: 700; }

    /* ── Empty / Loading ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; display: block; margin-bottom: 14px; color: var(--border); }
    .empty-state p { font-size: 1rem; }

    /* ── Main / Cards ── */
    main {
      max-width: 860px;
      margin: 0 auto 60px;
      padding: 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px 16px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s, border-color 0.2s, opacity 0.2s;
    }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card.answered {
      border-color: var(--green-border);
      background: var(--green-bg);
    }
    .card.hidden-card { display: none; }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-num {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      border-radius: 5px;
      padding: 2px 7px;
    }
    .card-folder {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      background: #F3F4F6;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-folder .icon { font-size: 13px; }

    .card-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .card-action-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .card-action-btn:hover {
      background: var(--bg);
      color: var(--text);
    }
    .card-action-btn.btn-delete-card:hover {
      background: #FEE2E2;
      color: #DC2626;
    }
    .card-action-btn .icon { font-size: 18px; }

    .card-question {
      margin-bottom: 14px;
    }
    .question-enunciado {
      font-size: 0.95rem;
      line-height: 1.7;
      font-weight: 500;
      color: var(--text);
      white-space: pre-wrap;
      margin-bottom: 12px;
    }
    .question-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-item {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text);
      transition: border-color 0.2s, background 0.2s;
      white-space: pre-wrap;
    }
    .option-item:hover {
      border-color: var(--primary-light);
      background: #fff;
    }

    .reveal-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      border-radius: 8px;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      background: rgba(255,107,0,0.04);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .reveal-btn:hover { background: var(--primary); color: #fff; }
    .reveal-btn .icon { font-size: 16px; }

    .card-answer { margin-top: 14px; }
    .answer-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .answer-label .icon { font-size: 15px; }
    .answer-final-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .answer-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .answer-badge .icon { font-size: 14px; }
    .answer-text-content {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.5;
    }
    .answer-text-content strong {
      color: var(--green);
      font-weight: 700;
    }
    
    .answer-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      margin-bottom: 16px;
    }
    .answer-tool-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }
    .answer-tool-btn:hover {
      background: var(--bg);
      border-color: var(--primary-light);
      color: var(--primary);
    }
    .answer-tool-btn .icon { font-size: 16px; }
    .answer-tool-btn.active {
      background: var(--primary-glow);
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .answer-explanation {
      padding: 20px;
      font-size: 0.9rem;
      color: var(--text);
      background: linear-gradient(135deg, #FEFCE8 0%, #FFF7ED 50%, #FFF 100%);
      border: 1px solid #FDE68A;
      border-radius: 12px;
      line-height: 1.7;
      display: none;
      margin-bottom: 16px;
    }
    .answer-explanation.visible {
      display: block;
    }
    .answer-explanation .exp-correct-answer {
      background: linear-gradient(90deg, #F0FDF4, #DCFCE7);
      border: 1px solid var(--green-border);
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #15803D;
      margin-bottom: 16px;
    }
    .answer-explanation .exp-paragraph {
      margin-bottom: 10px;
      color: var(--text);
      line-height: 1.7;
    }
    .answer-explanation .exp-paragraph strong {
      color: var(--primary);
    }
    .answer-explanation .exp-step {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }
    .answer-explanation .exp-step-num {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .answer-explanation .exp-step-text {
      flex: 1;
      line-height: 1.6;
    }
    .answer-explanation .exp-step-text strong {
      color: var(--primary);
    }
    .answer-explanation .exp-sub-item {
      padding-left: 38px;
      margin-bottom: 6px;
      position: relative;
      color: var(--text);
      line-height: 1.6;
    }
    .answer-explanation .exp-sub-item::before {
      content: '→';
      position: absolute;
      left: 22px;
      color: var(--primary-light);
      font-weight: 600;
    }
    .answer-explanation .exp-wrong {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #991B1B;
      line-height: 1.5;
    }
    .answer-explanation .exp-wrong strong {
      color: #DC2626;
    }
    .answer-explanation .exp-summary {
      background: linear-gradient(90deg, #EEF2FF, #E0E7FF);
      border: 1px solid #C7D2FE;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #4338CA;
      margin-top: 14px;
    }

    /* ── Review Card ── */
    .answer-review {
      display: none;
      margin-bottom: 16px;
      padding: 20px;
      background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 40%, #F5F3FF 100%);
      border: 1px solid #C7D2FE;
      border-radius: 12px;
      line-height: 1.7;
      font-size: 0.9rem;
    }
    .answer-review.visible { display: block; }

    .rev-section {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0 4px;
      margin-top: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text);
      border-bottom: 1px solid rgba(99, 102, 241, 0.15);
    }
    .rev-section:first-child { margin-top: 0; }
    .rev-emoji { font-size: 1.1rem; flex-shrink: 0; }
    .rev-title { text-transform: uppercase; letter-spacing: 0.4px; font-size: 0.78rem; color: #4338CA; }

    .rev-section.rev-concept { color: #4338CA; }
    .rev-section.rev-concept + .rev-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 4px;
    }
    .rev-section.rev-definition { color: #0369A1; border-bottom-color: rgba(3, 105, 161, 0.15); }
    .rev-section.rev-definition .rev-title { color: #0369A1; }
    .rev-section.rev-memorize { color: #B45309; border-bottom-color: rgba(180, 83, 9, 0.15); }
    .rev-section.rev-memorize .rev-title { color: #B45309; }
    .rev-section.rev-pitfall { color: #DC2626; border-bottom-color: rgba(220, 38, 38, 0.15); }
    .rev-section.rev-pitfall .rev-title { color: #DC2626; }
    .rev-section.rev-mnemonic { color: #7C3AED; border-bottom-color: rgba(124, 58, 237, 0.15); }
    .rev-section.rev-mnemonic .rev-title { color: #7C3AED; }
    .rev-section.rev-related { color: var(--muted); border-bottom-color: rgba(107, 114, 128, 0.15); }
    .rev-section.rev-related .rev-title { color: var(--muted); }

    .rev-text {
      margin: 4px 0 2px;
      color: var(--text);
      line-height: 1.7;
    }
    .rev-text strong { color: var(--indigo); }

    .rev-bullet {
      padding-left: 20px;
      position: relative;
      margin-bottom: 4px;
      line-height: 1.6;
      color: var(--text);
    }
    .rev-bullet::before {
      content: '•';
      position: absolute;
      left: 6px;
      color: var(--indigo);
      font-weight: 700;
    }
    .rev-bullet strong { color: var(--indigo); }

    .answer-source {
      margin-top: 8px;
      font-size: 0.73rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .answer-source .icon { font-size: 13px; }
    .card-date {
      margin-top: 10px;
      font-size: 0.7rem;
      color: var(--muted);
      opacity: 0.7;
    }

    /* ── Icon helper ── */
    .icon {
      font-family: 'Material Symbols Rounded';
      font-variation-settings: 'FILL' 1;
      font-size: 18px;
      vertical-align: middle;
      line-height: 1;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header, .toolbar-wrap { padding-left: 16px; padding-right: 16px; }
      main { padding: 14px 16px; }
      .progress-wrap { padding-left: 16px; padding-right: 16px; }
    }

    /* ── Print ── */
    @media print {
      body { background: #fff; color: #000; }
      header, .toolbar-wrap, .progress-wrap, .reveal-btn, .card-actions { display: none !important; }
      main { max-width: 100%; padding: 0; margin: 0; }
      .card {
        box-shadow: none;
        border: none;
        border-bottom: 1px solid #ccc;
        border-radius: 0;
        page-break-inside: avoid;
        padding: 15px 0;
      }
      .card-answer { display: block !important; }
      .answer-final-box { background: transparent; border: none; padding: 0; color: #000; margin-bottom: 8px; }
      .answer-letter { background: transparent; color: #000; border: 1px solid #000; box-shadow: none; width: 32px; height: 32px; font-size: 1.2rem; }
      .answer-text-content { color: #000; }
      .answer-tools { display: none !important; }
      .answer-explanation { display: block !important; background: transparent; border: none; padding: 0; color: #000; border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 8px; }
      .answer-explanation .exp-correct-answer { background: transparent; border: 1px solid #ccc; color: #000; }
      .answer-explanation .exp-step { background: transparent; border-left: 2px solid #000; }
      .answer-explanation .exp-step-num { background: #000; }
      .answer-explanation .exp-wrong { background: transparent; border: 1px solid #ccc; color: #000; }
      .answer-explanation .exp-summary { background: transparent; border: 1px solid #ccc; color: #000; }
      .answer-review { display: block !important; background: transparent; border: none; padding: 0; color: #000; border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 8px; }
      .answer-review .rev-section { color: #000; border-bottom-color: #ccc; }
      .answer-review .rev-section .rev-title { color: #000; }
      .answer-review .rev-text, .answer-review .rev-bullet { color: #000; }
      .question-enunciado { color: #000; }
      .option-item { background: transparent; border: none; padding: 4px 0; color: #000; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Answer<span>Hunter</span></div>
    <div class="logo-sub">Caderno de Estudos</div>
  </div>
  <div class="header-right">
    <span class="counter" id="counterEl">0 questões</span>
    <button class="btn-reset" id="btnReset" title="Reiniciar progresso">
      <span class="icon">restart_alt</span> Reiniciar
    </button>
  </div>
</header>

<div class="toolbar-wrap">
  <div class="toolbar">
    <div class="search-wrap">
      <span class="icon icon-search">search</span>
      <input type="text" id="searchInput" placeholder="Filtrar questões...">
    </div>
    <div class="chip-group">
      <button class="chip" id="chipHideAnswered">
        <span class="icon">visibility_off</span> Ocultar respondidas
      </button>
      <button class="chip active" id="chipRevealAll" data-state="hide">
        <span class="icon">lock_open</span> Revelar todas
      </button>
    </div>
    <div class="chip-group tools">
      <button class="tool-btn" id="btnCopyAll" title="Copiar todas as questões visíveis">
        <span class="icon">content_copy</span> Copiar
      </button>
      <button class="tool-btn" id="btnPrint" title="Imprimir ou salvar como PDF">
        <span class="icon">print</span> Imprimir
      </button>
    </div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-row">
    <span id="progressLabel">0 de 0 respondidas</span>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-pct" id="progressPct">0%</span>
  </div>
</div>

<main id="cardList">
  <div class="empty-state" id="emptyState">
    <span class="icon">hourglass_empty</span>
    <p>Carregando questões...</p>
  </div>
</main>

<footer id="footer"></footer>

<script src="study.js" type="module"></script>
</body>
</html>
