<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnswerHunter — Caderno de Estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B00;
      --primary-light: #FF9A40;
      --primary-glow: rgba(255, 107, 0, 0.12);
      --bg: #F7F9FC;
      --surface: #fff;
      --border: #E8EBF0;
      --text: #1A1A2E;
      --muted: #6B7280;
      --green: #16A34A;
      --green-bg: #F0FDF4;
      --green-border: #BBF7D0;
      --indigo: #6366F1;
      --indigo-bg: #EEF2FF;
      --header-sticky-offset: 80px;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      scrollbar-gutter: stable;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1A1A2E 0%, #2D2B55 100%);
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-family: 'Manrope', sans-serif; font-size: 1.25rem; font-weight: 800; }
    .logo span { color: var(--primary-light); }
    .logo-sub { font-size: 0.75rem; color: rgba(255,255,255,0.45); margin-top: 2px; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .counter {
      background: rgba(255,107,0,0.18);
      color: var(--primary-light);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .btn-reset {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .btn-reset:hover { background: rgba(255,255,255,0.14); color: #fff; }

    /* ── Toolbar ── */
    .toolbar-wrap {
      position: sticky;
      top: var(--header-sticky-offset);
      z-index: 90;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
    }
    .toolbar {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      row-gap: 8px;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
    }
    .search-wrap .icon-search {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--muted);
      pointer-events: none;
    }
    .toolbar input[type=text] {
      width: 100%;
      padding: 9px 14px 9px 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.88rem;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .toolbar input[type=text]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip-group.tools { margin-left: auto; flex-shrink: 0; }
    .chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .chip .icon { font-size: 15px; }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tool-btn:hover { background: var(--bg); border-color: var(--muted); }
    .tool-btn .icon { font-size: 16px; color: var(--muted); }

    /* ── Progress ── */
    .progress-wrap {
      max-width: 860px;
      margin: 0 auto 0;
      padding: 10px 32px 14px;
    }
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .progress-track {
      flex: 1;
      height: 7px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 4px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-pct { min-width: 40px; text-align: right; color: var(--primary); font-weight: 700; }

    /* ── Empty / Loading ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; display: block; margin-bottom: 14px; color: var(--border); }
    .empty-state p { font-size: 1rem; }

    /* ── Main / Cards ── */
    main {
      max-width: 860px;
      margin: 0 auto 60px;
      padding: 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px 16px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s, border-color 0.2s, opacity 0.2s;
    }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .card.answered {
      border-color: var(--green-border);
      background: var(--green-bg);
    }
    .card.for-review {
      border-color: #FDE68A;
      box-shadow: 0 2px 12px rgba(180, 83, 9, 0.12);
    }
    .card.hidden-card { display: none; }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .card-num {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      border-radius: 5px;
      padding: 2px 7px;
    }
    .card-folder {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      background: #F3F4F6;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .card-folder .icon { font-size: 13px; }
    .review-flag {
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #B45309;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .review-flag.visible { display: inline-flex; }
    .review-flag .icon { font-size: 13px; }

    .card-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .card-action-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .card-action-btn:hover {
      background: var(--bg);
      color: var(--text);
    }
    .card-action-btn.btn-delete-card:hover {
      background: #FEE2E2;
      color: #DC2626;
    }
    .card-action-btn.btn-review-card:hover,
    .card-action-btn.btn-review-card.active {
      background: #FFFBEB;
      color: #B45309;
    }
    .card-action-btn .icon { font-size: 18px; }

    .card-question {
      margin-bottom: 14px;
    }
    .question-enunciado {
      font-size: 0.95rem;
      line-height: 1.7;
      font-weight: 500;
      color: var(--text);
      white-space: pre-wrap;
      margin-bottom: 12px;
    }
    .question-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .option-item {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text);
      transition: border-color 0.2s, background 0.2s;
      white-space: pre-wrap;
    }
    .option-item:hover {
      border-color: var(--primary-light);
      background: #fff;
    }

    .reveal-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      border-radius: 8px;
      border: 1.5px solid var(--primary);
      color: var(--primary);
      background: rgba(255,107,0,0.04);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: 'Inter', sans-serif;
    }
    .reveal-btn:hover { background: var(--primary); color: #fff; }
    .reveal-btn .icon { font-size: 16px; }

    .card-answer { margin-top: 14px; }
    .answer-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .answer-label .icon { font-size: 15px; }
    .answer-final-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-left: 4px solid var(--green);
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .answer-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .answer-badge .icon { font-size: 14px; }
    .answer-text-content {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.5;
    }
    .answer-text-content strong {
      color: var(--green);
      font-weight: 700;
    }
    
    .answer-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      margin-bottom: 16px;
    }
    .answer-tool-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }
    .answer-tool-btn:hover {
      background: var(--bg);
      border-color: var(--primary-light);
      color: var(--primary);
    }
    .answer-tool-btn .icon { font-size: 16px; }
    .answer-tool-btn.active {
      background: var(--primary-glow);
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .answer-explanation {
      padding: 20px;
      font-size: 0.9rem;
      color: var(--text);
      background: linear-gradient(135deg, #FEFCE8 0%, #FFF7ED 50%, #FFF 100%);
      border: 1px solid #FDE68A;
      border-radius: 12px;
      line-height: 1.7;
      display: none;
      margin-bottom: 16px;
    }
    .answer-explanation.visible {
      display: block;
    }
    .answer-explanation .exp-correct-answer {
      background: linear-gradient(90deg, #F0FDF4, #DCFCE7);
      border: 1px solid var(--green-border);
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #15803D;
      margin-bottom: 16px;
    }
    .answer-explanation .exp-paragraph {
      margin-bottom: 10px;
      color: var(--text);
      line-height: 1.7;
    }
    .answer-explanation .exp-paragraph strong {
      color: var(--primary);
    }
    .answer-explanation .exp-step {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }
    .answer-explanation .exp-step-num {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .answer-explanation .exp-step-text {
      flex: 1;
      line-height: 1.6;
    }
    .answer-explanation .exp-step-text strong {
      color: var(--primary);
    }
    .answer-explanation .exp-sub-item {
      padding-left: 38px;
      margin-bottom: 6px;
      position: relative;
      color: var(--text);
      line-height: 1.6;
    }
    .answer-explanation .exp-sub-item::before {
      content: '→';
      position: absolute;
      left: 22px;
      color: var(--primary-light);
      font-weight: 600;
    }
    .answer-explanation .exp-wrong {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      padding: 8px 14px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      color: #991B1B;
      line-height: 1.5;
    }
    .answer-explanation .exp-wrong strong {
      color: #DC2626;
    }
    .answer-explanation .exp-summary {
      background: linear-gradient(90deg, #EEF2FF, #E0E7FF);
      border: 1px solid #C7D2FE;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #4338CA;
      margin-top: 14px;
    }

    /* ── Review Card ── */
    .answer-review {
      display: none;
      margin-bottom: 16px;
      padding: 20px;
      background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 40%, #F5F3FF 100%);
      border: 1px solid #C7D2FE;
      border-radius: 12px;
      line-height: 1.7;
      font-size: 0.9rem;
    }
    .answer-review.visible { display: block; }

    .rev-section {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0 4px;
      margin-top: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text);
      border-bottom: 1px solid rgba(99, 102, 241, 0.15);
    }
    .rev-section:first-child { margin-top: 0; }
    .rev-emoji { font-size: 1.1rem; flex-shrink: 0; }
    .rev-title { text-transform: uppercase; letter-spacing: 0.4px; font-size: 0.78rem; color: #4338CA; }

    .rev-section.rev-concept { color: #4338CA; }
    .rev-section.rev-concept + .rev-text {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-top: 4px;
    }
    .rev-section.rev-definition { color: #0369A1; border-bottom-color: rgba(3, 105, 161, 0.15); }
    .rev-section.rev-definition .rev-title { color: #0369A1; }
    .rev-section.rev-memorize { color: #B45309; border-bottom-color: rgba(180, 83, 9, 0.15); }
    .rev-section.rev-memorize .rev-title { color: #B45309; }
    .rev-section.rev-pitfall { color: #DC2626; border-bottom-color: rgba(220, 38, 38, 0.15); }
    .rev-section.rev-pitfall .rev-title { color: #DC2626; }
    .rev-section.rev-mnemonic { color: #7C3AED; border-bottom-color: rgba(124, 58, 237, 0.15); }
    .rev-section.rev-mnemonic .rev-title { color: #7C3AED; }
    .rev-section.rev-related { color: var(--muted); border-bottom-color: rgba(107, 114, 128, 0.15); }
    .rev-section.rev-related .rev-title { color: var(--muted); }

    .rev-text {
      margin: 4px 0 2px;
      color: var(--text);
      line-height: 1.7;
    }
    .rev-text strong { color: var(--indigo); }

    .rev-bullet {
      padding-left: 20px;
      position: relative;
      margin-bottom: 4px;
      line-height: 1.6;
      color: var(--text);
    }
    .rev-bullet::before {
      content: '•';
      position: absolute;
      left: 6px;
      color: var(--indigo);
      font-weight: 700;
    }
    .rev-bullet strong { color: var(--indigo); }

    .answer-source {
      margin-top: 8px;
      font-size: 0.73rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .answer-source .icon { font-size: 13px; }
    .card-date {
      margin-top: 10px;
      font-size: 0.7rem;
      color: var(--muted);
      opacity: 0.7;
    }

    /* ── Chat de Dúvida ── */
    .answer-chat {
      display: none;
      flex-direction: column;
      margin-bottom: 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface);
    }
    .answer-chat.visible { display: flex; }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 100%);
      color: #fff;
    }
    .chat-header .icon { font-size: 16px; }
    .chat-header-title {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      flex: 1;
    }
    .chat-clear-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .chat-clear-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .chat-clear-btn .icon { font-size: 16px; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      min-height: 80px;
      background: #F8F9FF;
    }

    .chat-bubble {
      display: flex;
      gap: 8px;
      animation: fadeInUp 0.18s ease;
    }
    .chat-bubble.user {
      flex-direction: row-reverse;
    }
    .chat-avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }
    .chat-bubble.ai .chat-avatar {
      background: linear-gradient(135deg, var(--indigo), #818CF8);
      color: #fff;
    }
    .chat-bubble.user .chat-avatar {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
    }
    .chat-bubble-text {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.86rem;
      line-height: 1.6;
      max-width: 85%;
    }
    .chat-bubble.ai .chat-bubble-text {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      border-top-left-radius: 3px;
    }
    .chat-bubble.user .chat-bubble-text {
      background: linear-gradient(135deg, var(--indigo), #818CF8);
      color: #fff;
      border-top-right-radius: 3px;
    }
    .chat-bubble-text strong { color: var(--primary); }
    .chat-bubble.user .chat-bubble-text strong { color: #FED7AA; }

    .chat-typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      border-top-left-radius: 3px;
      font-size: 0.8rem;
      color: var(--muted);
      width: fit-content;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--indigo);
      border-radius: 50%;
      animation: typingBounce 1.2s ease infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-4px); opacity: 1; }
    }

    .chat-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }
    .chat-empty-state .icon { font-size: 28px; color: var(--indigo); opacity: 0.5; }
    .chat-empty-state p { font-size: 0.8rem; }

    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .chat-textarea {
      flex: 1;
      resize: none;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      line-height: 1.5;
      outline: none;
      transition: border-color 0.15s;
      max-height: 100px;
      overflow-y: auto;
      background: var(--bg);
    }
    .chat-textarea:focus { border-color: var(--indigo); background: var(--surface); }
    .chat-textarea::placeholder { color: var(--muted); }
    .chat-send-btn {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--indigo), #818CF8);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    .chat-send-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .chat-send-btn .icon { font-size: 20px; }
    .icon {
      font-family: 'Material Symbols Rounded';
      font-variation-settings: 'FILL' 1;
      font-size: 18px;
      vertical-align: middle;
      line-height: 1;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── Quiz Modal ── */
    .quiz-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 30, 0.55);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .quiz-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .quiz-modal {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.22);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.22s ease;
    }
    .quiz-overlay.open .quiz-modal {
      transform: translateY(0) scale(1);
    }
    .quiz-modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
    }
    .quiz-modal-header .q-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--indigo), #818CF8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .quiz-modal-header .q-icon .icon {
      color: #fff;
      font-size: 20px;
    }
    .quiz-modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }
    .quiz-modal-subtitle {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .quiz-modal-close {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }
    .quiz-modal-close:hover { background: var(--bg); color: var(--text); }
    .quiz-modal-close .icon { font-size: 22px; }

    .quiz-modal-body {
      padding: 20px 22px;
      flex: 1;
    }

    /* Loading state */
    .quiz-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 40px 20px;
      color: var(--muted);
    }
    .quiz-loading .spin-icon {
      font-size: 36px;
      color: var(--indigo);
      animation: spin 1s linear infinite;
    }
    .quiz-loading p { font-size: 0.88rem; font-weight: 500; }

    /* Question source context */
    .quiz-context-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--indigo-bg);
      color: var(--indigo);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.73rem;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .quiz-context-badge .icon { font-size: 14px; }

    /* The generated question text */
    .quiz-question-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 18px;
      white-space: pre-wrap;
    }

    /* Options grid */
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .quiz-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      text-align: left;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }
    .quiz-option:hover:not(:disabled) {
      border-color: var(--indigo);
      background: var(--indigo-bg);
      transform: translateX(2px);
    }
    .quiz-option:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 2px;
    }
    .quiz-option.selected {
      border-color: var(--indigo);
      background: var(--indigo-bg);
    }
    .quiz-option.correct {
      border-color: var(--green);
      background: var(--green-bg);
    }
    .quiz-option.wrong {
      border-color: #EF4444;
      background: #FEF2F2;
    }
    .quiz-option:disabled { cursor: default; transform: none; }
    .quiz-option-letter {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .quiz-option.selected .quiz-option-letter {
      background: var(--indigo);
      border-color: var(--indigo);
      color: #fff;
    }
    .quiz-option.correct .quiz-option-letter {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }
    .quiz-option.wrong .quiz-option-letter {
      background: #EF4444;
      border-color: #EF4444;
      color: #fff;
    }
    .quiz-option-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
      flex: 1;
    }
    .quiz-option.correct .quiz-option-text { color: #15803D; font-weight: 500; }
    .quiz-option.wrong .quiz-option-text { color: #B91C1C; }
    .quiz-option-result-icon {
      display: none;
      flex-shrink: 0;
    }
    .quiz-option.correct .quiz-option-result-icon,
    .quiz-option.wrong .quiz-option-result-icon { display: flex; align-items: center; }
    .quiz-option.correct .quiz-option-result-icon .icon { color: var(--green); }
    .quiz-option.wrong .quiz-option-result-icon .icon { color: #EF4444; }

    /* Confirm button */
    .quiz-confirm-btn {
      width: 100%;
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--indigo) 0%, #818CF8 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-family: 'Inter', sans-serif;
      min-height: 44px;
    }
    .quiz-confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .quiz-confirm-btn:not(:disabled):hover { opacity: 0.92; transform: translateY(-1px); }

    /* Result feedback banner */
    .quiz-result-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .quiz-result-banner.show { display: flex; }
    .quiz-result-banner.correct {
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      color: #15803D;
    }
    .quiz-result-banner.wrong {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
    }
    .quiz-result-banner .icon { font-size: 22px; flex-shrink: 0; }

    /* Explanation block inside quiz */
    .quiz-explanation {
      display: none;
      background: linear-gradient(135deg, #FEFCE8 0%, #FFF7ED 100%);
      border: 1px solid #FDE68A;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 16px;
    }
    .quiz-explanation.show { display: block; }
    .quiz-explanation strong { color: var(--primary); }

    /* Footer actions */
    .quiz-modal-footer {
      display: flex;
      gap: 10px;
      padding: 14px 22px 18px;
      border-top: 1px solid var(--border);
    }
    .quiz-footer-btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      font-family: 'Inter', sans-serif;
    }
    .quiz-footer-btn.primary {
      background: var(--indigo);
      color: #fff;
      border: none;
    }
    .quiz-footer-btn.primary:hover { background: #4F46E5; }
    .quiz-footer-btn.secondary {
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .quiz-footer-btn.secondary:hover { border-color: var(--muted); }
    .quiz-footer-btn .icon { font-size: 18px; }

    /* Score badge in header */
    .quiz-score-badge {
      margin-left: auto;
      margin-right: 6px;
      display: none;
      align-items: center;
      gap: 4px;
      background: var(--green-bg);
      color: var(--green);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .quiz-score-badge.show { display: flex; }
    .quiz-score-badge .icon { font-size: 14px; }

    /* ── Simulado Cronometrado ── */
    .sim-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 30, 0.6);
      backdrop-filter: blur(5px);
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .sim-overlay.open { opacity: 1; pointer-events: all; }
    .sim-modal {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: translateY(20px) scale(0.97);
      transition: transform 0.22s ease;
    }
    .sim-overlay.open .sim-modal { transform: translateY(0) scale(1); }

    .sim-modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sim-modal-header .s-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #F59E0B, #F97316);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sim-modal-header .s-icon .icon { color: #fff; font-size: 20px; }
    .sim-header-info { flex: 1; }
    .sim-header-title { font-size: 0.94rem; font-weight: 700; color: var(--text); }
    .sim-header-sub { font-size: 0.74rem; color: var(--muted); }
    .sim-close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      transition: background 0.15s;
    }
    .sim-close-btn:hover { background: var(--bg); }
    .sim-close-btn .icon { font-size: 22px; }

    .sim-modal-body { flex: 1; overflow-y: auto; padding: 22px 22px; }

    /* Setup phase */
    .sim-setup-section { margin-bottom: 22px; }
    .sim-setup-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sim-setup-label .icon { font-size: 16px; }
    .sim-options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sim-option-pill {
      padding: 8px 18px;
      border-radius: 30px;
      border: 2px solid var(--border);
      background: var(--bg);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sim-option-pill:hover { border-color: #F59E0B; color: #92400E; }
    .sim-option-pill.selected {
      border-color: #F59E0B;
      background: #FEF3C7;
      color: #92400E;
    }
    .sim-option-pill .icon { font-size: 16px; }
    .sim-start-btn {
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #F59E0B 0%, #F97316 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      font-family: 'Inter', sans-serif;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .sim-start-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .sim-start-btn .icon { font-size: 20px; }

    /* Progress bar + timer */
    .sim-progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }
    .sim-progress-info { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
    .sim-timer {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      flex-shrink: 0;
    }
    .sim-timer.warning { color: #DC2626; border-color: #FCA5A5; background: #FEF2F2; }
    .sim-timer .icon { font-size: 16px; }
    .sim-progress-bar-track {
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .sim-progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #F59E0B, #F97316);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* Question display */
    .sim-q-number {
      font-size: 0.73rem;
      font-weight: 700;
      color: #D97706;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .sim-q-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.7;
      margin-bottom: 20px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .sim-reveal-btn {
      width: 100%;
      padding: 12px 20px;
      background: var(--surface);
      border: 2px dashed #D97706;
      border-radius: 12px;
      font-size: 0.89rem;
      font-weight: 600;
      color: #D97706;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
    }
    .sim-reveal-btn:hover { background: #FFFBEB; border-style: solid; }
    .sim-reveal-btn .icon { font-size: 20px; }

    .sim-answer-box {
      display: none;
      background: #FFFBEB;
      border: 1.5px solid #FDE68A;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .sim-answer-box.show { display: block; }
    .sim-answer-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #D97706;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .sim-answer-text {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.6;
    }

    .sim-self-assess {
      display: none;
      gap: 12px;
    }
    .sim-self-assess.show { display: flex; }
    .sim-assess-btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 48px;
      font-family: 'Inter', sans-serif;
      border: 2px solid transparent;
    }
    .sim-assess-btn.correct {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: #15803D;
    }
    .sim-assess-btn.correct:hover { background: #DCFCE7; }
    .sim-assess-btn.wrong {
      background: #FEF2F2;
      border-color: #FECACA;
      color: #B91C1C;
    }
    .sim-assess-btn.wrong:hover { background: #FEE2E2; }
    .sim-assess-btn .icon { font-size: 20px; }

    /* Results phase */
    .sim-results { text-align: center; padding: 8px 0; }
    .sim-score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: conic-gradient(var(--green) 0%, var(--green-bg) 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      position: relative;
      box-shadow: 0 4px 20px rgba(22, 163, 74, 0.25);
    }
    .sim-score-inner {
      width: 82px;
      height: 82px;
      background: var(--surface);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .sim-score-pct {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1;
    }
    .sim-score-pct-label { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
    .sim-results-title { font-size: 1.05rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .sim-results-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .sim-stats-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .sim-stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }
    .sim-stat-pill .icon { font-size: 16px; }
    .sim-stat-pill.green { background: var(--green-bg); border-color: var(--green-border); color: #15803D; }
    .sim-stat-pill.red { background: #FEF2F2; border-color: #FECACA; color: #B91C1C; }

    .sim-missed-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
      text-align: left;
    }
    .sim-missed-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
    .sim-missed-item {
      padding: 10px 12px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #7F1D1D;
      text-align: left;
      line-height: 1.5;
    }
    .sim-missed-item strong { color: #B91C1C; }

    .sim-results-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .sim-result-btn {
      flex: 1;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      font-family: 'Inter', sans-serif;
    }
    .sim-result-btn.primary {
      background: linear-gradient(135deg, #F59E0B, #F97316);
      color: #fff;
      border: none;
    }
    .sim-result-btn.secondary {
      background: var(--bg);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .sim-result-btn .icon { font-size: 18px; }

    /* Toolbar simulado button */
    .tool-btn.simulado-btn {
      background: linear-gradient(135deg, #FEF3C7, #FFF7ED);
      border-color: #FDE68A;
      color: #92400E;
    }
    .tool-btn.simulado-btn:hover {
      background: linear-gradient(135deg, #FDE68A, #FDBA74);
      border-color: #F59E0B;
    }

    /* ── Revisão Espaçada SM-2 ── */
    .sm2-rating-bar {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 14px 0 4px;
      border-top: 1px solid var(--border);
      margin-top: 12px;
    }
    .sm2-rating-bar.show { display: flex; }
    .sm2-rating-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sm2-rating-label .icon { font-size: 14px; }
    .sm2-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .sm2-btn {
      flex: 1;
      min-width: 70px;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-height: 56px;
    }
    .sm2-btn .icon { font-size: 18px; }
    .sm2-btn .sm2-next { font-size: 0.68rem; font-weight: 500; opacity: 0.8; }
    .sm2-btn.again { background: #FEF2F2; border-color: #FECACA; color: #B91C1C; }
    .sm2-btn.again:hover { background: #FEE2E2; }
    .sm2-btn.hard { background: #FFF7ED; border-color: #FED7AA; color: #C2410C; }
    .sm2-btn.hard:hover { background: #FFEDD5; }
    .sm2-btn.good { background: var(--green-bg); border-color: var(--green-border); color: #15803D; }
    .sm2-btn.good:hover { background: #DCFCE7; }
    .sm2-btn.easy { background: var(--indigo-bg); border-color: #C7D2FE; color: #4338CA; }
    .sm2-btn.easy:hover { background: #E0E7FF; }
    .sm2-btn.rated {
      opacity: 0.5;
      cursor: default;
    }
    .sm2-done-badge {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #15803D;
    }
    .sm2-done-badge.show { display: flex; }
    .sm2-done-badge .icon { font-size: 16px; }

    /* Due-today badge on card */
    .card-due-badge {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #1D4ED8;
    }
    .card-due-badge.show { display: inline-flex; }
    .card-due-badge .icon { font-size: 12px; }

    /* SM2 chip in toolbar */
    .chip.sm2-chip { color: #4338CA; }
    .chip.sm2-chip.active {
      background: var(--indigo-bg);
      border-color: #C7D2FE;
      color: #4338CA;
    }

    /* ── Dashboard de Desempenho ── */
    .dash-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 30, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1002;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .dash-overlay.open { opacity: 1; pointer-events: all; }
    .dash-modal {
      background: var(--surface);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: translateY(16px) scale(0.98);
      transition: transform 0.22s ease;
    }
    .dash-overlay.open .dash-modal { transform: none; }
    .dash-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #0F172A, #1E293B);
      color: #fff;
    }
    .dash-header .d-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dash-header .d-icon .icon { font-size: 18px; color: #fff; }
    .dash-header-title { font-size: 0.94rem; font-weight: 700; flex: 1; }
    .dash-close-btn {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.6); padding: 6px; border-radius: 8px;
      display: flex; align-items: center; transition: color 0.15s, background 0.15s;
    }
    .dash-close-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .dash-close-btn .icon { font-size: 22px; }
    .dash-body { flex: 1; overflow-y: auto; padding: 20px; }
    .dash-stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }
    @media (min-width: 480px) { .dash-stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .dash-stat-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 12px; text-align: center;
      position: relative; overflow: hidden;
    }
    .dash-stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }
    .dash-stat-card.blue::before { background: linear-gradient(90deg, #6366F1, #818CF8); }
    .dash-stat-card.green::before { background: linear-gradient(90deg, var(--green), #4ADE80); }
    .dash-stat-card.orange::before { background: linear-gradient(90deg, #F59E0B, #F97316); }
    .dash-stat-card.purple::before { background: linear-gradient(90deg, #8B5CF6, #A78BFA); }
    .dash-stat-value { font-size: 1.8rem; font-weight: 800; color: var(--text); line-height: 1; margin-bottom: 4px; }
    .dash-stat-label { font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .dash-section-title {
      font-size: 0.8rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.4px;
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .dash-section-title .icon { font-size: 15px; }
    .dash-xp-section { margin-bottom: 20px; }
    .dash-xp-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .dash-xp-label { font-size: 0.82rem; font-weight: 600; color: var(--text); }
    .dash-xp-val { font-size: 0.82rem; font-weight: 700; color: #8B5CF6; }
    .dash-xp-track { height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .dash-xp-fill { height: 100%; background: linear-gradient(90deg, #8B5CF6, #A78BFA); border-radius: 4px; transition: width 0.6s ease; }
    .dash-sim-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .dash-sim-table th { padding: 6px 10px; text-align: left; font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    .dash-sim-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
    .dash-sim-table tr:last-child td { border-bottom: none; }
    .dash-sim-score { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 0.8rem; }
    .dash-sim-score.high { background: var(--green-bg); color: #15803D; }
    .dash-sim-score.mid { background: #FEF3C7; color: #92400E; }
    .dash-sim-score.low { background: #FEF2F2; color: #B91C1C; }
    .dash-hard-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .dash-hard-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    .dash-ef-badge { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; flex-shrink: 0; }
    .dash-ef-badge.hard { background: #FEF2F2; color: #B91C1C; }
    .dash-ef-badge.medium { background: #FEF3C7; color: #92400E; }
    .dash-ef-badge.easy { background: var(--green-bg); color: #15803D; }
    .dash-hard-text { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 0.82rem; color: var(--text); }
    .dash-hard-errors { font-size: 0.72rem; color: #EF4444; font-weight: 600; flex-shrink: 0; }
    .tool-btn.dashboard-btn { background: linear-gradient(135deg, #EEF2FF, #F5F3FF); border-color: #C7D2FE; color: #4338CA; }
    .tool-btn.dashboard-btn:hover { background: linear-gradient(135deg, #C7D2FE, #DDD6FE); border-color: #818CF8; }
    .chip.errors-chip { color: #B91C1C; }
    .chip.errors-chip.active { background: #FEF2F2; border-color: #FECACA; color: #B91C1C; }

    /* ── XP Toast ── */
    .xp-toast {
      position: fixed; bottom: 80px; right: 24px; z-index: 9999;
      background: linear-gradient(135deg, #8B5CF6, #6366F1);
      color: #fff; padding: 8px 16px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
      animation: xpFlyUp 1.8s ease forwards; pointer-events: none;
    }
    @keyframes xpFlyUp {
      0% { opacity: 0; transform: translateY(10px); }
      20% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-20px); }
    }
    .xp-toast .icon { font-size: 16px; }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header, .toolbar-wrap { padding-left: 16px; padding-right: 16px; }
      main { padding: 14px 16px; }
      .progress-wrap { padding-left: 16px; padding-right: 16px; }
    }

    /* ── Print ── */
    @media print {
      body { background: #fff; color: #000; }
      header, .toolbar-wrap, .progress-wrap, .reveal-btn, .card-actions { display: none !important; }
      main { max-width: 100%; padding: 0; margin: 0; }
      .card {
        box-shadow: none;
        border: none;
        border-bottom: 1px solid #ccc;
        border-radius: 0;
        page-break-inside: avoid;
        padding: 15px 0;
      }
      .card-answer { display: block !important; }
      .answer-final-box { background: transparent; border: none; padding: 0; color: #000; margin-bottom: 8px; }
      .answer-letter { background: transparent; color: #000; border: 1px solid #000; box-shadow: none; width: 32px; height: 32px; font-size: 1.2rem; }
      .answer-text-content { color: #000; }
      .answer-tools { display: none !important; }
      .answer-explanation { display: block !important; background: transparent; border: none; padding: 0; color: #000; border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 8px; }
      .answer-explanation .exp-correct-answer { background: transparent; border: 1px solid #ccc; color: #000; }
      .answer-explanation .exp-step { background: transparent; border-left: 2px solid #000; }
      .answer-explanation .exp-step-num { background: #000; }
      .answer-explanation .exp-wrong { background: transparent; border: 1px solid #ccc; color: #000; }
      .answer-explanation .exp-summary { background: transparent; border: 1px solid #ccc; color: #000; }
      .answer-review { display: block !important; background: transparent; border: none; padding: 0; color: #000; border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 8px; }
      .answer-review .rev-section { color: #000; border-bottom-color: #ccc; }
      .answer-review .rev-section .rev-title { color: #000; }
      .answer-review .rev-text, .answer-review .rev-bullet { color: #000; }
      .question-enunciado { color: #000; }
      .option-item { background: transparent; border: none; padding: 4px 0; color: #000; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Answer<span>Hunter</span></div>
    <div class="logo-sub">Caderno de Estudos</div>
  </div>
  <div class="header-right">
    <span class="counter" id="counterEl">0 questões</span>
    <button class="btn-reset" id="btnReset" title="Reiniciar progresso">
      <span class="icon">restart_alt</span> Reiniciar
    </button>
  </div>
</header>

<div class="toolbar-wrap">
  <div class="toolbar">
    <div class="search-wrap">
      <span class="icon icon-search">search</span>
      <input type="text" id="searchInput" placeholder="Filtrar questões...">
    </div>
    <div class="chip-group">
      <button class="chip" id="chipHideAnswered">
        <span class="icon">visibility_off</span> Ocultar respondidas
      </button>
      <button class="chip" id="chipReviewOnly">
        <span class="icon">bookmark</span> <span class="chip-label">Somente revisão</span>
      </button>
      <button class="chip sm2-chip" id="chipSm2Due">
        <span class="icon">event_repeat</span> Revisão de hoje <span id="sm2DueCount" style="display:none;background:#4338CA;color:#fff;border-radius:10px;padding:1px 6px;font-size:0.7rem;margin-left:2px"></span>
      </button>
      <button class="chip errors-chip" id="chipErrors">
        <span class="icon">error_outline</span> Com erros
      </button>
      <button class="chip active" id="chipRevealAll" data-state="hide">
        <span class="icon">lock_open</span> Revelar todas
      </button>
    </div>
    <div class="chip-group tools">
      <button class="tool-btn dashboard-btn" id="btnDashboard" title="Dashboard de desempenho">
        <span class="icon">insights</span> Dashboard
      </button>
      <button class="tool-btn simulado-btn" id="btnSimulado" title="Iniciar simulado cronometrado">
        <span class="icon">timer</span> Simulado
      </button>
      <button class="tool-btn" id="btnCopyAll" title="Copiar todas as questões visíveis">
        <span class="icon">content_copy</span> Copiar
      </button>
      <button class="tool-btn" id="btnPrint" title="Imprimir ou salvar como PDF">
        <span class="icon">print</span> Imprimir
      </button>
    </div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-row">
    <span id="progressLabel">0 de 0 respondidas</span>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-pct" id="progressPct">0%</span>
  </div>
</div>

<main id="cardList">
  <div class="empty-state" id="emptyState">
    <span class="icon">hourglass_empty</span>
    <p>Carregando questões...</p>
  </div>
</main>

<footer id="footer"></footer>

<!-- ══ Dashboard de Desempenho Modal ══ -->
<div id="dashOverlay" class="dash-overlay" role="dialog" aria-modal="true" aria-labelledby="dashTitle" hidden>
  <div class="dash-modal">
    <div class="dash-header">
      <div class="d-icon"><span class="icon">insights</span></div>
      <span class="dash-header-title" id="dashTitle">Dashboard de Desempenho</span>
      <button class="dash-close-btn" id="dashCloseBtn" aria-label="Fechar dashboard">
        <span class="icon">close</span>
      </button>
    </div>
    <div class="dash-body" id="dashBody">
      <!-- dynamic content -->
    </div>
  </div>
</div>

<!-- ══ Quiz Interativo Modal ══ -->
<div id="quizOverlay" class="quiz-overlay" role="dialog" aria-modal="true" aria-labelledby="quizModalTitle" hidden>
  <div class="quiz-modal">
    <div class="quiz-modal-header">
      <div class="q-icon">
        <span class="icon">quiz</span>
      </div>
      <div>
        <div class="quiz-modal-title" id="quizModalTitle">Testar se aprendi</div>
        <div class="quiz-modal-subtitle">Questão similar gerada por IA</div>
      </div>
      <div class="quiz-score-badge" id="quizScoreBadge">
        <span class="icon">emoji_events</span>
        <span id="quizScoreText">0/0</span>
      </div>
      <button class="quiz-modal-close" id="quizModalClose" aria-label="Fechar quiz">
        <span class="icon">close</span>
      </button>
    </div>

    <div class="quiz-modal-body" id="quizModalBody">
      <!-- dynamic content injected by JS -->
    </div>

    <div class="quiz-modal-footer" id="quizModalFooter" style="display:none">
      <button class="quiz-footer-btn secondary" id="quizCloseFooterBtn">
        <span class="icon">close</span>
        Fechar
      </button>
      <button class="quiz-footer-btn primary" id="quizRetryBtn">
        <span class="icon">refresh</span>
        Nova questão
      </button>
    </div>
  </div>
</div>

<!-- ══ Simulado Cronometrado Modal ══ -->
<div id="simOverlay" class="sim-overlay" role="dialog" aria-modal="true" aria-labelledby="simModalTitle" hidden>
  <div class="sim-modal">
    <div class="sim-modal-header">
      <div class="s-icon"><span class="icon">timer</span></div>
      <div class="sim-header-info">
        <div class="sim-header-title" id="simModalTitle">Simulado Cronometrado</div>
        <div class="sim-header-sub" id="simHeaderSub">Configure e inicie seu simulado</div>
      </div>
      <button class="sim-close-btn" id="simCloseBtn" aria-label="Fechar simulado">
        <span class="icon">close</span>
      </button>
    </div>
    <div class="sim-modal-body" id="simModalBody">
      <!-- dynamic content -->
    </div>
  </div>
</div>

<script src="study.js" type="module"></script>
</body>
</html>
